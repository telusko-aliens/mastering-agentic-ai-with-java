spring.application.name=springai2


# in 1.1.8 --> if you say nothing spring ai applied 0.7 as temperature

# spring AI 2.0 will send nothing 
spring.ai.openai.chat.temperature=0.7


# IN CLASS (1.1.8):  spring.ai.openai.chat.options.model
#                    spring.ai.openai.chat.options.temperature
#
# NOW (2.0):         the ".options" segment is gone.


#spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.openai.chat.model=gpt-4.1-mini

spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none



