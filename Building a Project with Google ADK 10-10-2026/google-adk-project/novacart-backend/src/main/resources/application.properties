spring.application.name=novacart
server.port=8092

novacart.app-name=novacart

# Which model everything talks to. Override on the command line:
#   --novacart.model.provider=ollama --novacart.model.name=llama3.2
novacart.model.provider=gemini
novacart.model.name=gemini-flash-latest
novacart.model.ollama-url=http://localhost:11434/v1

# Partner Logistics. A separate company, a separate process, started separately.
novacart.partner.url=http://localhost:9100

# The React dev server.
novacart.cors.allowed-origin=http://localhost:5180

# Conversations and incidents on disk, so they survive a restart.
novacart.sessions.jdbc-url=jdbc:h2:file:./data/novacart;AUTO_SERVER=TRUE

# SSE connections stay open for as long as the browser is.
spring.mvc.async.request-timeout=-1

logging.level.root=WARN
logging.level.com.novacart=INFO
