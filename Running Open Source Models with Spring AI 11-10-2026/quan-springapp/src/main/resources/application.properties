spring.application.name=quan-springapp


# All from one Hugging Face repo. Same weights, three precisions.
#   f16     16 bits per number, the original
#   Q8_0     8 bits
#   Q4_K_M   about 4 bits, the default everybody actually runs

quantlab.repo=hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF
quantlab.quants=Q4_K_M,Q8_0,f16

# --- Ollama ------------------------------------------------------------------
# The model is chosen per request in BenchmarkService, so the one named here is
# only a default. Temperature 0 everywhere: we are measuring the model, not luck.

spring.ai.model.chat=ollama
spring.ai.ollama.chat.options.model=hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M
spring.ai.ollama.chat.options.temperature=0.0

spring.ai.model.embedding=none

# A 2.5 GB model answering six questions needs longer than the default.
spring.mvc.async.request-timeout=-1

